<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Usuarios · CaminandoLogros</title>
  <meta name="description" content="Registro y gestión de cuentas de usuario en CaminandoLogros.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="cabecera">
    <a href="index.html" class="logo">CaminandoLogros</a>

    <nav class="menu" aria-label="Principal">
      <button class="btn-tema" type="button" aria-label="Cambiar tema">
        <img src="img/moon.svg" alt="" width="20" height="20" aria-hidden="true">
      </button>
      <a href="index.html">Explorar</a>
      <a href="mis-runs.html">Mis Runs</a>
      <a href="crear-run.html">Crear Run</a>
      <a href="usuarios.html" aria-current="page">Usuarios</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main class="contenedor">
    <section class="bloque-formulario">
      <h1 id="titulo-form-registro">Registro de usuario</h1>

      <form id="form-registro" class="formulario-h2" novalidate>
        <div class="campo-formulario">
          <label for="reg-usuario">Nombre de usuario</label>
          <input
            type="text"
            id="reg-usuario"
            name="nombreUsuario"
            autocomplete="username"
            required
            minlength="3"
            maxlength="20"
            aria-describedby="error-reg-usuario"
          >
          <span id="error-reg-usuario" class="mensaje-error" aria-live="polite"></span>
        </div>

        <div class="campo-formulario">
          <label for="reg-correo">Correo electrónico</label>
          <input
            type="email"
            id="reg-correo"
            name="correo"
            autocomplete="email"
            required
            aria-describedby="error-reg-correo"
          >
          <span id="error-reg-correo" class="mensaje-error" aria-live="polite"></span>
        </div>

        <div class="campo-formulario">
          <label for="reg-password">Contraseña</label>
          <input
            type="password"
            id="reg-password"
            name="password"
            autocomplete="new-password"
            required
            minlength="8"
            aria-describedby="error-reg-password"
          >
          <span id="error-reg-password" class="mensaje-error" aria-live="polite"></span>
        </div>

        <div class="campo-formulario">
          <label for="reg-repetir">Repetir contraseña</label>
          <input
            type="password"
            id="reg-repetir"
            name="repetirPassword"
            autocomplete="new-password"
            required
            minlength="8"
            aria-describedby="error-reg-repetir"
          >
          <span id="error-reg-repetir" class="mensaje-error" aria-live="polite"></span>
        </div>

        <div class="campo-formulario">
          <label for="reg-fecha">Fecha de nacimiento</label>
          <input
            type="date"
            id="reg-fecha"
            name="fechaNacimiento"
            autocomplete="bday"
            required
            aria-describedby="error-reg-fecha"
          >
          <span id="error-reg-fecha" class="mensaje-error" aria-live="polite"></span>
        </div>

        <div class="campo-formulario campo-checkbox">
          <label for="reg-condiciones">
            <input
              type="checkbox"
              id="reg-condiciones"
              name="condiciones"
              required
              aria-describedby="error-reg-condiciones"
            >
            Acepto las condiciones de uso
          </label>
          <span id="error-reg-condiciones" class="mensaje-error" aria-live="polite"></span>
        </div>

        <div class="acciones-formulario">
          <button type="submit" id="btn-guardar-usuario" class="btn-primario">
            <span>Registrar usuario</span>
          </button>
          <button type="button" id="btn-cancelar-edicion" class="btn-secundario" hidden>
            <span>Cancelar edición</span>
          </button>
        </div>
      </form>
    </section>

    <section class="bloque-listado">
      <h2>Usuarios</h2>
      <div id="lista-usuarios" class="lista-registros"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
